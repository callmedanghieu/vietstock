name: Trích dữ liệu CG từ BCTN

on:
  release:
    types: [published]        # Cách chính: đính kèm PDF vào một Release
  push:
    paths:
      - "bctn/**"             # Cách phụ (đợt nhỏ): upload PDF vào thư mục bctn/
      - "cg_extract.py"
  workflow_dispatch:          # Nút "Run workflow" thủ công

permissions:
  contents: write

concurrency:
  group: extract
  cancel-in-progress: false   # đợt sau xếp hàng chờ đợt trước, không chạy chồng

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # luôn lấy ket_qua.xlsx mới nhất

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài OCR (cho file scan)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-vie

      - name: Cài thư viện Python
        run: pip install -r requirements.txt

      - name: Tải PDF đính kèm trong Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bctn_release
          gh release download "${{ github.event.release.tag_name }}" --pattern "*.pdf" --pattern "*.PDF" -D bctn_release || true
          echo "Số file tải về: $(ls bctn_release | wc -l)"

      - name: Chạy trích dữ liệu
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python cg_extract.py api --in bctn bctn_release --out ket_qua.xlsx

      - name: Commit kết quả về repo
        if: always()          # lưu kết quả kể cả khi bước trên lỗi/hết giờ giữa chừng
        run: |
          git config user.name "cg-bot"
          git config user.email "cg-bot@users.noreply.github.com"
          git add ket_qua.xlsx
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "Cập nhật ket_qua.xlsx [skip ci]"
          git pull --rebase origin main || true
          git push
